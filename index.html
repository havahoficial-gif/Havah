  <body style="margin: 0; overflow-x: hidden; background-color: #2e6aa0;">
    <div id="root">
      <!-- Instant 0ms Native Splash: Renders the exact millisecond index.html arrives (Zero Blank Screen) -->
      <div id="instant-splash" style="position:fixed;inset:0;background:linear-gradient(180deg, #2e6aa0 0%, #4182b8 35%, #68a4d4 70%, #b6dbf5 100%);display:flex;align-items:center;justify-content:center;z-index:99999;">

    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Service worker: solo en https real. En localhost se elimina para evitar pantallas en blanco por caché vieja.
      (function () {
        if (!('serviceWorker' in navigator)) return;
        var local = /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
        if (local) {
          navigator.serviceWorker.getRegistrations().then(function (rs) { rs.forEach(function (r) { r.unregister(); }); });
          if (window.caches) caches.keys().then(function (ks) { ks.forEach(function (k) { caches.delete(k); }); });
        } else if (location.protocol === 'https:') {
          window.addEventListener('load', function () { navigator.serviceWorker.register('/sw.js').catch(function () {}); });
        }
      })();
    </script>
  </body>
